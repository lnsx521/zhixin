[package]
name = "zhixin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "把 iPhone 的通知和验证码接到 Windows 上"

[lib]
name = "zhixin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"

zhixin-core = { path = "../crates/zhixin-core" }
zhixin-ble = { path = "../crates/zhixin-ble" }
zhixin-uia = { path = "../crates/zhixin-uia" }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tauri-plugin-updater = "2"
axum = { version = "0.8", features = ["multipart"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde_urlencoded = "0.7"
tower = { version = "0.5.3", features = ["limit", "util"] }
tokio-util = { version = "0.7", features = ["io"] }
if-addrs = "0.14"
dirs = "5"
mdns-sd = "0.21.7"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt"] }


[dependencies.windows]
workspace = true
features = [
    "Win32_Security_Cryptography",
    "Win32_System_Shutdown",
    "Win32_System_Diagnostics_Debug",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
]
