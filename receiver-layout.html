<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>接收服务卡片 · 布局拖拽</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6fa; color: #1f2733; display: flex; gap: 40px; padding: 40px; }
  .panel { flex: 1; }
  h1 { font-size: 17px; margin-bottom: 4px; }
  .sub { font-size: 12.5px; color: #6b7686; margin-bottom: 18px; line-height: 1.7; }
  /* 模拟设置页 Section 卡片 */
  .section {
    background: #fff; border: 1px solid #e6eaf0; border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05); padding: 14px 16px; width: 560px;
  }
  .dropzone { min-height: 60px; }
  .item {
    border: 1.5px dashed #b8c4d4; border-radius: 8px; padding: 9px 12px;
    margin-bottom: 2px; cursor: grab; user-select: none; position: relative;
    background: #fbfcfe; transition: border-color .15s;
  }
  .item:hover { border-color: #2f6feb; }
  .item.dragging { opacity: .35; border-style: solid; }
  .item .tag {
    position: absolute; top: -8px; right: 6px; font-size: 10px; background: #2f6feb;
    color: #fff; padding: 1px 7px; border-radius: 8px; font-weight: 600;
  }
  .item .real { pointer-events: none; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .title-line { font-size: 14.5px; font-weight: 700; color: #1f2733; }
  .status { color: #1a7f37; font-size: 12px; }
  .switch { width: 36px; height: 20px; background: #2f6feb; border-radius: 10px; position: relative; }
  .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; }
  .adv { color: #6b7686; font-size: 12px; }
  .row-line { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .row-line .lbl { color: #1f2733; }
  .save { background: #2f6feb; color: #fff; border: 0; border-radius: 7px; padding: 6px 18px; font-size: 12.5px; }
  .exportbar { margin-top: 18px; }
  button.go { width: 100%; border: 0; border-radius: 8px; padding: 10px 0; background: #2f6feb; color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .out { margin-top: 12px; background: #fff; border: 1px solid #e6eaf0; border-radius: 8px; padding: 12px; font-size: 12px; color: #2f6feb; white-space: pre-wrap; line-height: 1.8; min-height: 50px; word-break: break-all; }
  .hint { font-size: 12px; color: #6b7686; margin-top: 10px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="panel">
    <h1>「接收服务」卡片 · 布局拖拽</h1>
    <p class="sub">按住色块上下拖动调顺序（一行为一个元素）。排好后点「导出布局」，把文字发给安安，他按此重排真实页面。</p>
    <div class="section"><div class="dropzone" id="zone"></div></div>
    <div class="exportbar">
      <button class="go" onclick="exportLayout()">导出布局（复制到剪贴板）</button>
      <div class="out" id="out">（尚未导出）</div>
      <p class="hint">· 拖动 = 调顺序（第一行元素会并排显示在卡片标题行，其余逐行显示）<br>· 双击色块 = 从卡片移除该元素</p>
    </div>
  </div>
<script>
const DEFAULT = [
  { id: "title", label: "卡片标题「接收服务」", real: "<span class='title-line'>接收服务</span>" },
  { id: "status", label: "运行状态 ● 运行中", real: "<span class='status'>● 运行中</span>" },
  { id: "switch", label: "启用开关 [开关]", real: "<span class='switch'></span>" },
  { id: "adv", label: "高级设置 ▸（触发钮）", real: "<span class='adv'>高级设置 ▸</span>" },
  { id: "scope", label: "监听范围行", real: "<span class='row-line'><span class='lbl'>监听范围</span><span class='adv'>所有网卡 ▾</span></span>" },
  { id: "port", label: "端口行", real: "<span class='row-line'><span class='lbl'>端口</span><span class='adv'>24836</span></span>" },
  { id: "copy", label: "自动复制验证码行", real: "<span class='row-line'><span class='lbl'>允许网络消息自动复制验证码</span><span class='switch' style='background:#c8cdd6'></span></span>" },
  { id: "save", label: "应用按钮", real: "<span class='save'>应用</span>" },
];
let order = DEFAULT.map(d => d.id);
const zone = document.getElementById("zone");
let dragged = null;

function render() {
  zone.innerHTML = "";
  order.forEach(id => {
    const d = DEFAULT.find(x => x.id === id);
    const el = document.createElement("div");
    el.className = "item" + (dragged === id ? " dragging" : "");
    el.draggable = true;
    el.dataset.id = id;
    el.innerHTML = `<span class="tag">${d.label}</span><div class="real">${d.real}</div>`;
    el.addEventListener("dragstart", () => { dragged = id; });
    el.addEventListener("dragend", () => { dragged = null; render(); });
    el.addEventListener("dblclick", () => { order = order.filter(x => x !== id); render(); });
    zone.appendChild(el);
  });
}
zone.addEventListener("dragover", e => {
  e.preventDefault();
  const after = [...zone.querySelectorAll(".item:not(.dragging)")].reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = e.clientY - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: child };
    return closest;
  }, { offset: -Infinity }).element;
  const dragEl = zone.querySelector(".dragging");
  if (!dragEl) return;
  if (after == null) zone.appendChild(dragEl); else zone.insertBefore(dragEl, after);
});
zone.addEventListener("drop", () => {
  order = [...zone.querySelectorAll(".item")].map(el => el.dataset.id);
  render();
});
function exportLayout() {
  const text = "【接收服务卡片布局】\n" + order.map((id, i) => `${i + 1}. ${DEFAULT.find(d => d.id === id).label}`).join("\n") + "\n（第 1 行元素并排在卡片标题行，其余逐行显示）";
  document.getElementById("out").textContent = text;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById("out").textContent = text + "\n✓ 已复制，直接粘贴给安安";
  }).catch(() => {});
}
render();
</script>
</body>
</html>
